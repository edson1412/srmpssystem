{% extends 'accounts/base_autha.html' %}
{% load static %}

{% block title %}Password Change Successful{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-lg p-4 text-center" style="max-width: 600px; width: 100%; border-radius: 15px;">
        <div class="card-body">
            <h2 class="card-title mb-4" style="color: #28a745; font-weight: bold;">
                <i class="fas fa-lock-open me-2"></i>Password Changed!
            </h2>
            <p class="lead">
                Your password has been set. You can now log in with your new password.
            </p>
            <div class="mt-4">
                <a href="{% url 'login' %}" class="btn btn-primary rounded-pill">
                    <i class="fas fa-sign-in-alt me-2"></i> Log in
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
