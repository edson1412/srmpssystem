{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Login - Prison HRMS{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: maroon; /* Changed to maroon as requested */
            /* Ensure body takes full height and is a flex container for its direct child (main) */
            display: flex;
            justify-content: center; /* Center horizontally */
            align-items: center;    /* Center vertically */
            min-height: 100vh;
            margin: 0;
        }
        /* Make main fill the available space and be a flex container for its content */
        main {
            display: flex;
            justify-content: center; /* Center content horizontally within main */
            align-items: center;      /* Center content vertically within main */
            width: 100%; /* Ensure main takes full width */
            padding: 15px; /* Add some padding around the main content area */
        }
        .login-container-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center; /* Center items horizontally within the wrapper */
            max-width: 500px; /* Max width for the entire login block */
            width: 100%;
            /* No need for margin: auto here if parent (main) is handling centering */
        }
        .card {
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            background-color: rgba(255, 255, 255, 0.85);
            border: none;
        }
        .custom-button {
            background-color: #0056b3;
            border-color: #0056b3;
            color: #fff;
        }
        .custom-button:hover {
            background-color: #003f80;
            border-color: #003f80;
            color: #fff;
        }
        /* Styles for Toast Container */
        .toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1080;
        }
        /* Custom Toast Colors based on Django message tags */
        .toast.text-bg-success { background-color: #198754 !important; }
        .toast.text-bg-info { background-color: #0dcaf0 !important; }
        .toast.text-bg-warning { background-color: #ffc107 !important; color: #212529 !important; }
        .toast.text-bg-danger { background-color: #dc3545 !important; }

        /* Logo styling */
        .login-logo {
            max-width: 120px;
            height: auto;
            margin-bottom: 20px;
            display: block;
        }
    </style>
</head>
<body>
    <main> {# Removed class="container" here #}
        {# Toast Container for Django Messages #}
        <div class="toast-container">
            {% if messages %}
                {% for message in messages %}
                    <div class="toast align-items-center text-white border-0 fade show {% if message.tags == 'success' %}text-bg-success{% elif message.tags == 'error' %}text-bg-danger{% elif message.tags == 'info' %}text-bg-info{% elif message.tags == 'warning' %}text-bg-warning{% endif %}" role="alert" aria-live="assertive" aria-atomic="true">
                        <div class="d-flex">
                            <div class="toast-body">
                                {{ message }}
                            </div>
                            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                        </div>
                    </div>
                {% endfor %}
            {% endif %}
        </div>

        {% block content %}
        {% endblock %}
    </main>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var toastElList = [].slice.call(document.querySelectorAll('.toast'))
            var toastList = toastElList.map(function(toastEl) {
                return new bootstrap.Toast(toastEl, { autohide: true, delay: 5000 })
            })
            toastList.forEach(toast => toast.show());
        });
    </script>
</body>
</html>
