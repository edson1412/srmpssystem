{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ title }} - HRMS{% endblock %}

{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="card shadow-sm mb-4">
    <div class="card-header bg-dark text-white">
        <h5 class="mb-0"><i class="fas fa-building me-2"></i>Assign Office to {{ officer.full_name }}</h5>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-dark mt-3 shadow-sm">
                <i class="fas fa-save me-2"></i>Save Assignment
            </button>
            <a href="{% url 'hrms:officer_detail' service_number=officer.service_number %}" class="btn btn-secondary mt-3 ms-2 shadow-sm">
                <i class="fas fa-times-circle me-2"></i>Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
