{% extends 'base.html' %}

{% block content %}
<section class="hrms-page py-4 py-lg-5 position-relative overflow-hidden">
    <div class="page-sheen"></div>
    <div class="container position-relative">
        <div class="page-header" data-aos="fade-up">
            <div class="page-header__meta">
                {% block page_badge %}{% endblock %}
                <h1 class="page-title mb-2">{% block page_title %}{% endblock %}</h1>
                {% block page_description %}{% endblock %}
            </div>
            <div class="page-actions">
                {% block page_actions %}{% endblock %}
            </div>
        </div>

        {% block page_filters %}{% endblock %}

        <div class="page-body" data-aos="fade-up" data-aos-delay="100">
            {% block page_body %}{% endblock %}
        </div>
    </div>
</section>
{% endblock %}
